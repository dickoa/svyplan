url: https://dickoa.gitlab.io/svyplan
template:
  bootstrap: 5
  math-rendering: katex

navbar:
  structure:
    left: [intro, reference, articles, tutorials, book, news]
  components:
    book:
      text: Book
      href: https://www.ahmadoudicko.com/sampling-design-r-book/

articles:
  - title: "Getting started"
    desc: "Plan one estimate and check its expected precision."
    contents:
      - svyplan

reference:
- title: Overview
  desc: Package overview and the argument-to-symbol notation map.
  contents:
  - svyplan-package

- title: Proportions, means and ratios
  desc: Size or evaluate a proportion, a mean or a ratio of two totals.
  contents:
  - n_prop
  - prec_prop
  - n_mean
  - prec_mean
  - n_ratio
  - prec_ratio

- title: Several indicators at once
  desc: Size or evaluate several indicators at once, taking the most demanding.
  contents:
  - n_multi
  - prec_multi

- title: Cluster designs
  desc: >
    Size or evaluate a two- or three-stage cluster design, for one indicator
    or a table of them.
  contents:
  - n_cluster
  - prec_cluster
  - varcomp

- title: Stratified designs
  desc: >
    Size or evaluate an allocation across strata or domains, under a budget
    or a CV target.
  contents:
  - n_alloc
  - prec_alloc
  - merge_psus
  - n_alloc-generalized
  - strata_bound
  - predict.svyplan_strata

- title: Two-phase designs
  desc: Size or evaluate a two-phase design that screens or follows up.
  contents:
  - n_twophase
  - prec_twophase

- title: Repeated surveys
  desc: >
    Size or evaluate a change between two occasions, the average of several,
    or a panel that must survive attrition, and describe the rotation the
    three share.
  contents:
  - n_change
  - prec_change
  - n_pooled
  - prec_pooled
  - n_panel
  - prec_panel
  - design_rotation
  - design_overlap
  - design_schedule

- title: Power
  desc: >
    Find the power of a two-group comparison or a difference-in-differences.
  contents:
  - power_prop
  - power_mean
  - power_did

- title: Design inputs
  desc: >
    Reusable design defaults, and the design effect, effective size and
    degrees of freedom a plan implies.
  contents:
  - svyplan
  - design_effect
  - effective_n
  - design_df

- title: Confidence intervals
  desc: Confidence intervals for a planned design.
  contents:
  - confint.svyplan

- title: Print and summary methods
  desc: Format and display svyplan objects.
  contents:
  - print.svyplan
  - print.svyplan_deff
  - print.svyplan_df
  - print.svyplan_overlap
  - print.svyplan_panel
  - print.svyplan_rotation
  - print.svyplan_schedule
  - summary.svyplan_alloc
  - summary.svyplan_twophase

- title: Predict methods
  desc: Grid exploration for svyplan objects.
  contents:
  - predict.svyplan

- title: Plot methods
  desc: Plot svyplan objects.
  contents:
  - plot.svyplan
  - plot.svyplan_overlap
